/* Full-screen panorama, quiet frosted chrome: title card top-left, room strip grouped by floor at the foot. One dark look on purpose - the photos are the page. */
:root {

#viewer { position: fixed; inset: 0; }

.t-eyebrow { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--brass); font-weight: 600; }
.t-title strong { font-family: var(--f-display); font-weight: 600; font-size: 20px; text-wrap: balance; }
.t-where { margin: 0 auto; background: rgba(28, 27, 24, .78); color: var(--paper); padding: 8px 16px; border-radius: 99px; font-size: 14px; transition: opacity .3s; }
.t-where:empty { opacity: 0; }
.t-rooms { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(52px + env(safe-area-inset-bottom, 0px)); max-width: calc(100% - 32px);
  display: flex; gap: 4px; padding: 6px; background: var(--frost); backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 14px;
  overflow-x: auto; scrollbar-width: none; z-index: 10; }
.t-rooms::-webkit-scrollbar { display: none; }
.t-rooms .sep { width: 1px; background: var(--line); margin: 6px 4px; flex: none; }
.t-rooms .lvl { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); align-self: center; padding: 0 6px; flex: none; font-weight: 600; }

.t-rooms button.on { background: var(--ink); color: var(--paper); }
.t-rooms button:focus-visible { outline: 2px solid var(--brass); outline-offset: 1px; }
.t-help { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); font-size: 12.5px; color: var(--ink-2);

.t-help.hide { opacity: 0; }
.t-help .touch { display: none; }

.t-link { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; transition: transform .25s; }
.t-link:hover { transform: translateY(-3px); }

.t-link-dot::after { content: ""; position: absolute; left: 50%; top: 50%; width: 12px; height: 12px; margin: -4px 0 0 -6px; border-left: 3px solid var(--ink); border-top: 3px solid var(--ink); transform: rotate(45deg); }

.t-note { position: fixed; top: calc(86px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); margin: 0; font-size: 11.5px; color: var(--ink-2);

  display: flex; flex-direction: column; overflow: hidden; }

.board h2 { margin: 0; font-family: var(--f-display); font-weight: 600; font-size: 18px; text-wrap: balance; }
.board .x { border: 0; background: transparent; font-size: 15px; cursor: pointer; color: var(--ink-2); padding: 4px 6px; }
.board .body { overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
.board > footer { padding: 10px 16px 14px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.slot { display: flex; flex-direction: column; gap: 6px; }
.slot .lab { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
.slot .lab b { font-weight: 600; }
.slot .lab span { color: var(--ink-2); text-align: right; min-width: 0; overflow-wrap: anywhere; }

.hint { font-size: 13px; color: var(--ink-2); line-height: 1.45; margin: 0; }
.gotos { display: flex; flex-wrap: wrap; gap: 6px; }
.goto { border: 1px solid var(--line); background: transparent; border-radius: 99px; padding: 6px 11px; font-size: 13px; cursor: pointer; color: var(--ink); }
.busy { font-size: 12px; color: var(--muted); min-height: 1em; }
.sheet { position: fixed; inset: 0; z-index: 30; background: rgba(28, 27, 24, .55); display: grid; place-items: center;
  padding-block: calc(16px + env(safe-area-inset-top, 0px)) calc(16px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.sheet .card { background: var(--paper); color: var(--ink); border-radius: 14px; width: min(720px, 100%); max-height: 100%; display: flex; flex-direction: column; overflow: hidden; }
.sheet .card > div { padding: 18px 20px; }
.sheet h2 { margin: 0 0 4px; font-family: var(--f-display); font-size: 22px; text-wrap: balance; }
.sheet .tbl { overflow: auto; padding-top: 0 !important; min-height: 0; }
.sheet table { width: 100%; border-collapse: collapse; font-size: 14px; }
.sheet th, .sheet td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }

<div id="viewer"></div>
<header class="t-top">
  <div class="t-title"><span class="t-eyebrow">360° tour</span><strong>The Owen</strong></div>
  <div class="t-where" id="tWhere"></div>
  <button class="t-choices" id="tChoices" type="button" aria-expanded="false" aria-controls="board">Choose finishes</button>
</header>
<aside class="board" id="board" hidden aria-label="Finish choices">
  <header><h2 id="bTitle">Choices in this room</h2><button class="x" id="bClose" type="button" aria-label="Close the choices">✕</button></header>
  <div class="body" id="bBody"></div>
  <footer><div class="busy" id="bBusy" aria-live="polite"></div></footer>
</aside>

<nav class="t-rooms" id="tRooms" aria-label="Rooms"></nav>
<div class="t-help" id="tHelp"><span class="desk">Drag to look around · Click an arrow or a room below to move</span><span class="touch">Drag to look around · Tap an arrow or a room below to move</span></div>
<div class="t-loading" id="tLoading"><div><span class="spin"></span><p>Loading the home…</p></div></div>
<p class="t-note" id="tNote"></p>
<script type="module">

import { Viewer } from "@photo-sphere-viewer/core";
import { MarkersPlugin } from "@photo-sphere-viewer/markers-plugin";
import { VirtualTourPlugin } from "@photo-sphere-viewer/virtual-tour-plugin";
// tour.json: { plan, unit, start, nodes: [{ id, name, floor, look, links: [{ to, label, yaw, pitch }] }] }; yaw 0 = facing the back of the house
const $ = (s) => document.querySelector(s);
const rad = (d) => (d * Math.PI) / 180;
const data = await fetch("tour.json").then((r) => r.json());
const SEL = await fetch("sel.json").then((r) => r.json());
const pick = {};
try { Object.assign(pick, JSON.parse(localStorage.getItem("house-tour-picks-" + location.pathname) || "{}")); } catch (e) {}
const savePicks = () => { try { localStorage.setItem("house-tour-picks-" + location.pathname, JSON.stringify(pick)); } catch (e) {} };
const cur = (sid) => pick[sid] ?? SEL.slots[sid].default;
const optOf = (sid, i) => SEL.slots[sid].options.find((o) => o.i === i) || SEL.slots[sid].options[0];
const imgs = {};
const img = (src) => imgs[src] || (imgs[src] = new Promise((ok, bad) => { const im = new Image(); im.onload = () => ok(im); im.onerror = bad; im.src = src; }));
const urls = {};
async function panoFor(pid) {                       // the room's panorama with the chosen finishes laid over it
  const layers = (SEL.rooms[pid] || []).filter((L) => cur(L.slot) !== SEL.slots[L.slot].default && L.opts[String(cur(L.slot))]);
  if (!layers.length) return `p/${pid}-4k.jpg`;
  const c = document.createElement("canvas"); c.width = SEL.W; c.height = SEL.H; const g = c.getContext("2d");
  g.drawImage(await img(`p/${pid}-4k.jpg`), 0, 0, SEL.W, SEL.H);
  for (const L of layers) { const [x0, y0, x1, y1] = L.box; g.drawImage(await img(L.opts[String(cur(L.slot))]), x0, y0, x1 - x0, y1 - y0); }
  const blob = await new Promise((ok) => c.toBlob(ok, "image/jpeg", 0.9));
  if (urls[pid]) URL.revokeObjectURL(urls[pid]);
  return (urls[pid] = URL.createObjectURL(blob));
}
$("#tNote").textContent = `${data.unit} · unfurnished · standard finishes shown`;
const byId = Object.fromEntries(data.nodes.map((n) => [n.id, n]));
const arrow = (link) => { const el = document.createElement("div"); el.className = "t-link";
  el.innerHTML = `<span class="t-link-dot"></span><span class="t-link-label">${link.data.label}</span>`; return el; };
const viewer = new Viewer({
  container: "viewer", navbar: false, loadingTxt: "", minFov: 35, maxFov: 100, defaultZoomLvl: 10, mousewheelCtrlKey: false, touchmoveTwoFingers: false,
  plugins: [MarkersPlugin, [VirtualTourPlugin, {
    positionMode: "manual", renderMode: "2d", startNodeId: data.start, preload: true, showLinkTooltip: false,
    arrowStyle: { element: arrow, size: { width: 150, height: 80 } },
    transitionOptions: { showLoader: true, effect: "fade", speed: "25rpm", rotation: true },
    nodes: data.nodes.map((n) => ({ id: n.id, name: n.name, panorama: `p/${n.id}-4k.jpg`, thumbnail: `p/${n.id}-thumb.jpg`,
      links: n.links.map((l) => ({ nodeId: l.to, position: { yaw: rad(l.yaw), pitch: rad(l.pitch) }, data: { label: l.label } })) })),
  }]],
});
const tour = viewer.getPlugin(VirtualTourPlugin);
const SELROOMS = Object.keys(SEL.rooms).filter((r) => byId[r]);
let curNode = data.start;
async function refresh() {                          // re-lay the finishes: this room first (it reloads), then the others quietly
  for (const pid of [curNode, ...SELROOMS.filter((r) => r !== curNode)]) {
    if (!SEL.rooms[pid]) continue;
    if (pid === curNode) $("#bBusy").textContent = "Updating the room…";
    const url = await panoFor(pid);
    tour.updateNode({ id: pid, panorama: url });
    if (pid === curNode) $("#bBusy").textContent = "";
  }
}
const board = $("#board"), body = $("#bBody");
function renderBoard() {
  const node = byId[curNode]; const layers = SEL.rooms[curNode] || [];
  body.innerHTML = "";
  if (!layers.length) {
    $("#bTitle").textContent = "Choose finishes";
    body.insertAdjacentHTML("beforeend", `<p class="hint">You can see and change finishes in these rooms. Pick one to go there.</p><div class="gotos"></div>`);
    const g = body.querySelector(".gotos");
    SELROOMS.forEach((pid) => { const b = document.createElement("button"); b.className = "goto"; b.type = "button"; b.textContent = byId[pid].name;
      b.onclick = () => tour.setCurrentNode(pid, { rotation: false }).then(() => viewer.rotate({ yaw: rad(byId[pid].look), pitch: 0 })); g.appendChild(b); });
    return;
  }
  $("#bTitle").textContent = `Choices in the ${node.name.toLowerCase()}`;
  for (const L of layers) {
    const sid = L.slot, s = SEL.slots[sid], c = cur(sid);
    const el = document.createElement("div"); el.className = "slot";
    el.innerHTML = `<div class="lab"><b>${s.label}</b><span>${optOf(sid, c).name}</span></div>`;
    const grid = document.createElement("div"); grid.className = "sws";
    for (const o of s.options) {
      const b = document.createElement("button"); b.type = "button"; b.className = "sw"; b.style.backgroundImage = `url(${o.sw})`;
      b.title = o.name; b.setAttribute("aria-label", `${s.label}: ${o.name}`); b.setAttribute("aria-pressed", o.i === c);
      b.onclick = () => { pick[sid] = o.i; savePicks(); renderBoard(); refresh(); };
      grid.appendChild(b);
    }
    el.appendChild(grid); body.appendChild(el);
  }
}
const openBoard = (on) => { board.hidden = !on; $("#tChoices").setAttribute("aria-expanded", String(on)); if (on) renderBoard(); };
$("#tChoices").onclick = () => openBoard(board.hidden);
$("#bClose").onclick = () => openBoard(false);
const pendingRefresh = Object.keys(pick).length > 0;
const rooms = $("#tRooms");
const LVL = { "-1": "Outside", 0: "Main floor", 1: "Upstairs", 2: "Basement" };
[-1, 0, 1, 2].forEach((f) => {
  const list = data.nodes.filter((n) => n.floor === f);
  if (!list.length) return;
  if (rooms.children.length) rooms.insertAdjacentHTML("beforeend", `<span class="sep"></span>`);
  rooms.insertAdjacentHTML("beforeend", `<span class="lvl">${LVL[f]}</span>`);
  list.forEach((n) => rooms.insertAdjacentHTML("beforeend", `<button type="button" data-id="${n.id}">${n.name}</button>`));
});
rooms.addEventListener("click", (e) => {
  const b = e.target.closest("button[data-id]"); if (!b || b.classList.contains("on")) return;
  const n = byId[b.dataset.id];
  tour.setCurrentNode(n.id, { rotation: false }).then(() => viewer.rotate({ yaw: rad(n.look), pitch: 0 }));
});
let first = true;
tour.addEventListener("node-changed", ({ node }) => {
  $("#tWhere").textContent = node.name; curNode = node.id; if (!board.hidden) renderBoard();
  rooms.querySelectorAll("button").forEach((b) => { b.classList.toggle("on", b.dataset.id === node.id);
    if (b.dataset.id === node.id) b.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" }); });
  if (first) { first = false; viewer.rotate({ yaw: rad(byId[node.id].look), pitch: 0 }); $("#tLoading").classList.add("hide"); if (pendingRefresh) refresh(); }
});
let helpTimer = setTimeout(() => $("#tHelp").classList.add("hide"), 9000);
viewer.addEventListener("position-updated", () => { clearTimeout(helpTimer); helpTimer = setTimeout(() => $("#tHelp").classList.add("hide"), 2500); }, { once: true });

</script>
